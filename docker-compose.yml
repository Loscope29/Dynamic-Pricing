services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimization-pricing-api:latest
    container_name: pricing_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: optimization-pricing-streamlit:latest
    container_name: pricing_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Interface MLflow : lecture des experiences d'entrainement.
  # Profil optionnel -> `docker compose --profile tracking up`
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    container_name: pricing_mlflow
    profiles: ["tracking"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlartifacts:/mlflow/mlartifacts
    command: >
      mlflow ui
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/mlartifacts
      --host 0.0.0.0
      --port 5000
