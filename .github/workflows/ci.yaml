name: Pricing Optimization CI

# Ces workflows supposent que `optimization_pricing/` est la racine du depot
# (cas d'un projet publie seul). Si le projet vit dans un monorepo, ajouter en
# tete de chaque job :
#   defaults:
#     run:
#       working-directory: chemin/vers/optimization_pricing
# et prefixer les `context:`/`file:` des etapes Docker par ce meme chemin.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        # Les tests dependant des CSV Olist bruts se skippent d'eux-memes
        # (cf. tests/conftest.py) : la CI valide la logique, pas le dataset.
        run: python -m pytest tests -v --tb=short

      - name: Verifier que l'API demarre avec les artefacts versionnes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app

          with TestClient(app) as client:
              health = client.get("/health").json()
              print("health:", health)
              assert health["status"] == "ok", "API degradee : artefacts manquants"
              body = client.post(
                  "/optimize",
                  json={"product": {"category": "toys", "price": 100.0}},
              ).json()
              print("prix recommande:", body["recommendations"]["ml"]["recommended_price"])
          PY

  docker:
    name: Build des images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: optimization-pricing-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Streamlit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: false
          load: true
          tags: optimization-pricing-streamlit:ci
          cache-from: type=gha,scope=streamlit
          cache-to: type=gha,mode=max,scope=streamlit

      - name: Smoke test du conteneur API
        run: |
          docker run -d --name pricing_ci -p 8000:8000 optimization-pricing-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          docker rm -f pricing_ci
